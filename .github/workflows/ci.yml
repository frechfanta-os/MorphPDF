name: CI Quality & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-go:
    name: Backend Go Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go/go.sum

      - name: Go Vet
        working-directory: backend/go
        run: go vet ./...

      - name: Go Tests
        working-directory: backend/go
        run: go test -v -race ./...

  mobile-flutter:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile/flutter
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: mobile/flutter
        run: flutter analyze

      - name: Flutter Tests
        working-directory: mobile/flutter
        run: flutter test --coverage
